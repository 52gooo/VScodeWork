<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆读者调查问卷</title>
    <style>
        .A {
            width: 516px;
            margin: 8px auto;
            padding: 8px;
            border: 8px solid #ffccff;
            font-family: "Times New Roman", serif;
            font-size: 14px;
        }

        .B {
            padding: 16px 0;
            border: 1px solid #ffccff;
            text-align: center;
            font-size: 20px;
        }

        .C {
            padding: 12px 2px;
            border: 1px solid #ffccff;
            text-align: center;
        }

        .D {
            padding: 4px;
            border: 1px solid #ffccff;
        }

        .E {
            padding: 12px 0;
            border: 1px solid #ffccff;
            text-align: center;
        }

        .F {
            width: 300px;
        }

        .G {
            width: 450px;
            height: 60px;
        }
    </style>
</head>
<body>
    <form class="A">
        <div class="B">图书馆读者调查问卷</div>
        <div class="C">
            为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！
        </div>

        <div class="D">
            1.您的年级<br>
            请你选择：
            <select name="grade">
                <option value="">请选择</option>
                <option value="一年级">一年级</option>
                <option value="二年级">二年级</option>
                <option value="三年级">三年级</option>
                <option value="四年级">四年级</option>
            </select>
        </div>

        <div class="D">
            2.您的专业<br>
            <input class="F" type="text" name="major">
        </div>

        <div class="D">
            3.对于图书馆的阅览环境<br>
            <label><input type="radio" name="environment" value="满意">满意</label><br>
            <label><input type="radio" name="environment" value="基本满意">基本满意</label><br>
            <label><input type="radio" name="environment" value="不满意">不满意，您的建议：</label>
            <input type="text" name="environmentAdvice">
        </div>

        <div class="D">
            4.您到图书馆的原因是（可多选）：<br>
            <label><input type="checkbox" name="reason" value="借阅专业图书">借阅专业图书</label><br>
            <label><input type="checkbox" name="reason" value="随便坐坐，翻翻书刊">随便坐坐，翻翻书刊</label><br>
            <label><input type="checkbox" name="reason" value="借阅光盘">借阅光盘</label><br>
            <label><input type="checkbox" name="reason" value="参加图书馆组织的活动">参加图书馆组织的活动</label><br>
            <label><input type="checkbox" name="reason" value="自习，复习功课">自习，复习功课</label><br>
            <label><input type="checkbox" name="reason" value="上网">上网</label><br>
            <label><input type="checkbox" name="reason" value="检索电子文献">检索电子文献</label>
        </div>

        <div class="D">
            5.您到图书馆的频率<br>
            <label><input type="radio" name="frequency" value="几乎每天">几乎每天</label><br>
            <label><input type="radio" name="frequency" value="每周1-2次">每周1-2次</label><br>
            <label><input type="radio" name="frequency" value="每月1-2次">每月1-2次</label><br>
            <label><input type="radio" name="frequency" value="几乎不去">几乎不去</label>
        </div>

        <div class="D">
            6.您对学校的建议<br>
            请您提出宝贵建议：<br>
            <textarea class="G" name="suggestion"></textarea>
        </div>

        <div class="E">
            <input type="submit" value="提交答案">
            &nbsp;
            <input type="reset" value="清 空">
        </div>
    </form>
</body>
</html>
