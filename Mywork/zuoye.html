<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>个人名片</title>
	<!-- 引入独立的 CSS 样式文件，保持 HTML 结构与样式分离 -->
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<!-- 页面主内容：个人名片卡片 -->
	<main class="business-card">
		<!-- 头像使用圆形图片展示 -->
		<img
			class="avatar"
			src="https://i.pravatar.cc/240?img=12"
			alt="林简的头像"
		>

		<!-- 个人基本信息 -->
		<h1>林简</h1>
		<p class="job-title">前端开发工程师</p>

		<!-- 联系方式列表 -->
		<address class="contact-info">
			<a href="mailto:linjian@example.com">linjian@example.com</a>
			<a href="tel:+8613800138000">+86 138 0013 8000</a>
			<span>中国 · 上海</span>
		</address>
	</main>
</body>
</html>
